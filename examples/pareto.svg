<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
<title id="title">Downtime Pareto chart</title>
<desc id="desc">Bars show downtime minutes by cause in descending order. The orange line shows cumulative percentage.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="75" y="30" font-family="sans-serif" font-size="18">Synthetic downtime by cause</text>
<line x1="75" y1="325" x2="580" y2="325" stroke="#333"/>
<line x1="75" y1="65" x2="75" y2="325" stroke="#333"/>
<text x="5" y="65" font-family="sans-serif" font-size="12">90 min</text>
<text x="584" y="65" font-family="sans-serif" font-size="12">100%</text>
<text x="584" y="325" font-family="sans-serif" font-size="12">0%</text>
<rect x="134.2" y="65.0" width="50" height="260.0" fill="#1769aa"/>
<text x="159.2" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="12">90</text>
<text x="159.2" y="347" text-anchor="middle" font-family="sans-serif" font-size="12">Material shortage</text>
<rect x="302.5" y="151.7" width="50" height="173.3" fill="#1769aa"/>
<text x="327.5" y="145.7" text-anchor="middle" font-family="sans-serif" font-size="12">60</text>
<text x="327.5" y="347" text-anchor="middle" font-family="sans-serif" font-size="12">Setup</text>
<rect x="470.8" y="238.3" width="50" height="86.7" fill="#1769aa"/>
<text x="495.8" y="232.3" text-anchor="middle" font-family="sans-serif" font-size="12">30</text>
<text x="495.8" y="347" text-anchor="middle" font-family="sans-serif" font-size="12">Maintenance</text>
<polyline points="159.2,195.0 327.5,108.3 495.8,65.0" fill="none" stroke="#c05800" stroke-width="3"/>
<circle cx="159.2" cy="195.0" r="4" fill="#c05800"/>
<circle cx="327.5" cy="108.3" r="4" fill="#c05800"/>
<circle cx="495.8" cy="65.0" r="4" fill="#c05800"/>
<rect x="75" y="410" width="15" height="12" fill="#1769aa"/>
<text x="97" y="421" font-family="sans-serif" font-size="12">Downtime minutes</text>
<line x1="250" y1="416" x2="269" y2="416" stroke="#c05800" stroke-width="3"/>
<text x="277" y="421" font-family="sans-serif" font-size="12">Cumulative share</text>
</svg>
