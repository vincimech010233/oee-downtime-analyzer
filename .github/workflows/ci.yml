name: Offline Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Python and compile
        run: |
          python3 --version
          python3 -m compileall -q oee.py oee_recovery.py tests
      - name: Run deterministic offline tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reproduce fictional recovery report
        run: |
          python3 oee_recovery.py data/synthetic_shifts.csv --recovery-percent 50 > /tmp/oee-recovery.md
          grep -F 'Baseline OEE: **73.40%**' /tmp/oee-recovery.md
